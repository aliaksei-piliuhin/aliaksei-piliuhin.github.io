# The layout text of site

# ----- Commons label -----

layout:
  post: Пост
  category: Категория
  tag: Тег

# The tabs of sidebar
tabs:
  # format: <filename_without_extension>: <value>
  home: Работы
  categories: Категории
  tags: Теги
  archives: Архивы
  about: Обо мне

# the text displayed in the search bar & search results
search:
  hint: поиск
  cancel: Отмена
  no_results: Ничего не найдено :(

panel:
  lastmod: Недавно Обновлено
  trending_tags: Популярные Теги
  toc: Содержание

copyright:
  # Shown at the bottom of the post
  license:
    template: This post is licensed under :LICENSE_NAME by the author.
    name: CC BY 4.0
    link: https://creativecommons.org/licenses/by/4.0/

  # Displayed in the footer
  brief: All rights reserved.
  verbose: >-
    Unauthorized copying, modification, distribution, or use of these files and information, via any medium, is strictly prohibited. The limitation does not apply to theme Chirpy files.

meta: Using the :THEME theme for :PLATFORM.

not_found:
  statement: Кажется, здесь ничего нет (º _ º ).

notification:
  update_found: Доступен новый контент
  update: Обновить

theme:
  light: Light
  dark: Dark
  system: System

# ----- Posts related labels -----

post:
  written_by: Автор
  posted: Опубликовано
  updated: Обновлено
  words: слов
  pageview_measure: просмотров
  read_time:
    unit: min
    prompt: read
  edit: Edit this post
  relate_posts: Further Reading
  share: Share
  button:
    next: Newer
    previous: Older
    copy_code:
      succeed: Copied!
    share_link:
      title: Copy link
      succeed: Link copied successfully!

# Date time format.
# See: <http://strftime.net/>, <https://day.js.org/docs/en/display/format>
df:
  post:
    strftime: "%b %e, %Y"
    dayjs: "ll"
  archives:
    strftime: "%b"
    dayjs: "MMM"

# categories page
categories:
  category_measure:
    singular: категория
    plural: категории
  post_measure:
    singular: пост
    plural: посты
